<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Field Ops · Field Assistant Portal</title>
<meta name="theme-color" content="#ca8a04">
<link rel="icon" href="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview(1).png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#ca8a04;--gold-dark:#a16207;--gold-light:#fbbf24;--gold-soft:#fef3c7;--gold-tint:rgba(202,138,4,.08);
  --bg:#f6f8fb;--surface:#fff;--surface-alt:#f8fafc;
  --text:#0f172a;--text-soft:#334155;--text-muted:#64748b;--text-light:#94a3b8;
  --border:#e2e8f0;--border-soft:#f1f5f9;
  --success:#10b981;--success-bg:#ecfdf5;
  --warning:#f59e0b;--warning-bg:#fffbeb;
  --danger:#ef4444;--danger-bg:#fef2f2;
  --info:#3b82f6;--info-bg:#eff6ff;
  --purple:#8b5cf6;--purple-bg:#faf5ff;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08),0 2px 6px -2px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px -8px rgba(15,23,42,.12),0 4px 12px -4px rgba(15,23,42,.06);
  --shadow-xl:0 24px 48px -12px rgba(15,23,42,.18);
  --shadow-gold:0 12px 32px -8px rgba(202,138,4,.35);
  --radius-sm:10px;--radius:14px;--radius-lg:18px;--radius-xl:24px;--radius-full:9999px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --topbar-h:64px;--cart-w:380px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* TOPBAR */
.topbar{background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border-soft);padding:0 1.5rem;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:contain;background:#fff;box-shadow:var(--shadow-xs)}
.brand-name{font-weight:800;font-size:.95rem;color:var(--text);letter-spacing:-.02em}
.brand-tag{font-size:.6rem;font-weight:700;color:var(--text-light);letter-spacing:1.5px;text-transform:uppercase;margin-left:2px}
.biz-chip{display:flex;align-items:center;gap:.5rem;padding:.3rem .7rem .3rem .35rem;background:var(--gold-soft);border:1px solid #fde68a;border-radius:100px;font-size:.76rem;cursor:pointer;transition:all .15s;position:relative;max-width:220px;font-weight:700;color:var(--gold-dark)}
.biz-chip:hover{border-color:var(--gold);background:var(--gold-tint)}
.biz-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0;overflow:hidden}
.biz-chip .av img{width:100%;height:100%;object-fit:cover}
.biz-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.biz-chip .chev{font-size:.55rem;color:var(--gold-dark);flex-shrink:0}
.biz-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:280px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:.5rem;display:none;z-index:200}
.biz-menu.on{display:block;animation:popIn .2s ease}
.biz-menu .sh{padding:.5rem .8rem .35rem;font-size:.6rem;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:1px}
.biz-menu .it{display:flex;align-items:center;gap:.65rem;padding:.6rem .8rem;border-radius:9px;cursor:pointer;transition:background .15s;text-decoration:none;color:inherit}
.biz-menu .it:hover{background:var(--surface-alt)}
.biz-menu .it.current{background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold)}
.biz-menu .it .av{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;overflow:hidden}
.biz-menu .it .av img{width:100%;height:100%;object-fit:cover}
.biz-menu .it .inf{flex:1;min-width:0}
.biz-menu .it .nm{font-size:.8rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz-menu .it .rl{font-size:.62rem;color:var(--text-light);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:.1rem}
.biz-menu .it .ck{color:var(--gold);font-size:.75rem;flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cart-badge{position:relative;background:var(--text);color:#fff;border:none;padding:.5rem .85rem;border-radius:var(--radius-full);font-family:var(--font);font-weight:800;font-size:.78rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.cart-badge:hover{background:var(--gold-dark);transform:translateY(-1px)}
.cart-badge .count{background:var(--gold-light);color:var(--gold-dark);border-radius:var(--radius-full);padding:0 6px;font-size:.7rem;min-width:20px;text-align:center}
.user-menu{position:relative}
.user-avatar-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .2s;overflow:hidden;padding:0}
.user-avatar-btn:hover{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-tint);transform:scale(1.05)}
.user-avatar-btn img{width:100%;height:100%;object-fit:cover}
.user-dropdown{position:absolute;top:52px;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:.5rem;min-width:260px;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:all .2s cubic-bezier(.4,0,.2,1);z-index:200}
.user-dropdown.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.dropdown-header{padding:.75rem;display:flex;align-items:center;gap:12px;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold-soft),#fff);border:1px solid #fde68a;margin-bottom:.4rem}
.dropdown-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem;flex-shrink:0;overflow:hidden}
.dropdown-avatar img{width:100%;height:100%;object-fit:cover}
.dropdown-user-info{min-width:0;flex:1}
.dropdown-user-name{font-weight:700;font-size:.85rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dropdown-user-email{font-size:.68rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dropdown-user-role{font-size:.62rem;color:var(--gold-dark);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;display:inline-flex;align-items:center;gap:4px}
.user-dropdown-item{display:flex;align-items:center;gap:12px;padding:.65rem .85rem;font-size:.82rem;color:var(--text-soft);cursor:pointer;transition:all .15s;text-decoration:none;border:none;background:none;width:100%;font-family:var(--font);text-align:left;font-weight:600;border-radius:var(--radius)}
.user-dropdown-item:hover{background:var(--surface-alt);color:var(--text)}
.user-dropdown-item i{width:18px;text-align:center;font-size:.85rem;color:var(--text-muted)}
.user-dropdown-item:hover i{color:var(--gold)}
.dropdown-divider{height:1px;background:var(--border-soft);margin:.4rem .6rem}
.user-dropdown-item.signout{color:var(--danger)}
.user-dropdown-item.signout i{color:var(--danger)}
.user-dropdown-item.signout:hover{background:var(--danger-bg)}

/* MAIN */
.main{padding:1.5rem;max-width:1400px;margin:0 auto}

/* TABS */
.tabs-wrap{margin-bottom:1.25rem}
.tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:var(--radius-full);border:1px solid var(--border-soft);box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:none;width:fit-content;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:.65rem 1.15rem;border-radius:var(--radius-full);border:none;cursor:pointer;font-family:var(--font);font-size:.82rem;font-weight:700;background:transparent;color:var(--text-muted);transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab-btn i{font-size:.88rem}
.tab-btn:hover{color:var(--gold)}
.tab-btn.active{background:var(--text);color:#fff;box-shadow:0 6px 16px -6px rgba(15,23,42,.4)}
.tab-btn.active i{color:var(--gold-light)}
.tab-count{background:rgba(0,0,0,.08);padding:1px 7px;border-radius:var(--radius-full);font-size:.68rem;font-weight:800;min-width:22px;text-align:center}
.tab-btn.active .tab-count{background:rgba(255,255,255,.2);color:#fff}

/* POS GRID */
.pos-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--cart-w);gap:1.25rem;align-items:start}
.pos-left{min-width:0}

/* STEP CARD */
.step{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-soft);box-shadow:var(--shadow-xs);margin-bottom:1rem;overflow:hidden}
.step-head{padding:.9rem 1.1rem;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.step-head h3{font-size:.88rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;color:var(--text)}
.step-head h3 .step-num{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:.7rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.step-head .step-status{font-size:.7rem;font-weight:700;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px}
.step-body{padding:1rem 1.1rem}

/* PRODUCT SEARCH + CATEGORIES */
.prod-toolbar{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:.82rem}
.search-box input{width:100%;padding:.75rem 1rem .75rem 2.75rem;border:1.5px solid var(--border-soft);border-radius:var(--radius-full);font-size:.85rem;font-family:var(--font);background:#fff;transition:all .2s;color:var(--text)}
.search-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-tint)}
.cat-strip{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1rem}
.cat-chip{padding:.45rem .9rem;border:1.5px solid var(--border-soft);border-radius:var(--radius-full);background:#fff;font-family:var(--font);font-size:.74rem;font-weight:700;color:var(--text-soft);cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-chip:hover{border-color:var(--gold);color:var(--gold-dark)}
.cat-chip.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* PRODUCT GRID + CARDS */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
.prod-card{background:#fff;border:1.5px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;transition:all .15s;display:flex;flex-direction:column;text-align:left;user-select:none;font-family:var(--font);position:relative}
.prod-card:hover{border-color:var(--gold);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.prod-card.out{opacity:.5;pointer-events:none}
.prod-card .pcard-main{background:transparent;border:none;padding:0;display:flex;flex-direction:column;width:100%;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.prod-card .pcard-main:active{transform:scale(.98)}
.prod-card .pimg{width:100%;aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;border-bottom:1px solid var(--border-soft);position:relative}
.prod-card .pimg img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.prod-card .pimg i{font-size:1.8rem;color:var(--text-light)}
.prod-card .pinfo{padding:.7rem .8rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.prod-card .pname{font-size:.78rem;font-weight:700;color:var(--text);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2em}
.prod-card .pcat{font-size:.6rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px}
.prod-card .pprice{font-size:.9rem;font-weight:800;color:var(--gold-dark);letter-spacing:-.02em;margin-top:auto}
.prod-card .pstock{font-size:.62rem;color:var(--text-muted);font-weight:600}
.prod-card .pstock.low{color:var(--warning);font-weight:700}
.prod-card .pbadge{position:absolute;top:.5rem;left:.5rem;font-size:.55rem;font-weight:800;padding:.2rem .5rem;border-radius:var(--radius-full);text-transform:uppercase;letter-spacing:.3px;z-index:2;background:var(--danger-bg);color:#991b1b}
.prod-card .qty-added{position:absolute;top:.5rem;left:.5rem;background:var(--gold);color:#fff;font-size:.68rem;font-weight:800;padding:.15rem .5rem;border-radius:var(--radius-full);z-index:2;box-shadow:var(--shadow-sm);animation:popIn .2s ease}
.prod-card .pcard-add{position:absolute;bottom:.6rem;right:.6rem;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;box-shadow:var(--shadow-md);transition:all .15s;z-index:3}
.prod-card .pcard-add:hover{background:var(--gold-dark);transform:scale(1.08)}
.prod-card .pcard-add:active{transform:scale(.94)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* PRODUCT DETAIL SHEET */
.pd-hero{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#fef3c7,#fff);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:1.25rem;border:1px solid var(--border-soft);padding:20px}
.pd-hero img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.pd-hero i{font-size:4rem;color:var(--text-light)}
.pd-header{margin-bottom:1rem}
.pd-cat{display:inline-block;font-size:.62rem;font-weight:800;color:var(--gold-dark);background:var(--gold-soft);padding:.2rem .6rem;border-radius:var(--radius-full);text-transform:uppercase;letter-spacing:.4px;margin-bottom:.5rem}
.pd-name{font-size:1.3rem;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.25;margin-bottom:.4rem}
.pd-price{font-size:1.75rem;font-weight:800;color:var(--gold-dark);letter-spacing:-.03em;line-height:1}
.pd-stock{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;margin-left:.75rem;color:var(--text-muted);vertical-align:middle}
.pd-stock.low{color:var(--warning)}
.pd-stock.out{color:var(--danger)}
.pd-stock::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.pd-section{margin-bottom:1rem;padding-top:1rem;border-top:1px dashed var(--border-soft)}
.pd-section h4{font-size:.68rem;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.6rem}
.pd-desc{font-size:.85rem;color:var(--text-soft);line-height:1.7;word-wrap:break-word}
.pd-desc strong{color:var(--text);font-weight:700}
.pd-desc em{color:var(--text-soft);font-style:italic}
.pd-desc p{margin-bottom:.75rem}
.pd-desc p:last-child{margin-bottom:0}
.pd-qty{display:flex;align-items:center;justify-content:center;gap:1.25rem;padding:.75rem;background:var(--surface-alt);border-radius:var(--radius);margin-bottom:1rem}
.pd-qty button{width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--border);color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .15s}
.pd-qty button:hover:not(:disabled){background:var(--gold-soft);color:var(--gold-dark);border-color:var(--gold)}
.pd-qty button:disabled{opacity:.4;cursor:not-allowed}
.pd-qty .n{font-size:1.4rem;font-weight:800;color:var(--text);min-width:50px;text-align:center}
.pd-actions{display:flex;gap:.6rem}
.pd-actions .btn{flex:1;padding:.95rem;font-size:.88rem}
.pd-subtotal{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;background:var(--gold-soft);border-radius:var(--radius);margin-bottom:1rem;font-size:.82rem;font-weight:700;color:var(--gold-dark)}
.pd-subtotal .v{font-size:1.1rem;font-weight:800}

/* CART */
.cart{background:#fff;border:1px solid var(--border-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);display:flex;flex-direction:column;overflow:hidden;position:sticky;top:calc(var(--topbar-h) + 1.25rem);max-height:calc(100vh - var(--topbar-h) - 2.5rem)}
.cart-head{padding:1rem 1.1rem;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-shrink:0}
.cart-head h3{font-size:.92rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:.5rem}
.cart-head h3 i{color:var(--gold)}
.cart-head .clear-btn{background:transparent;border:none;color:var(--text-muted);font-size:.72rem;font-family:var(--font);font-weight:700;cursor:pointer;padding:.3rem .5rem;border-radius:6px;transition:all .15s}
.cart-head .clear-btn:hover{color:var(--danger);background:var(--danger-bg)}
.cart-items{flex:1;overflow-y:auto;padding:.5rem .9rem;min-height:120px}
.cart-empty{text-align:center;padding:2rem 1rem;color:var(--text-muted)}
.cart-empty i{font-size:2rem;opacity:.3;display:block;margin-bottom:.6rem;color:var(--gold)}
.cart-empty p{font-size:.8rem;line-height:1.5}
.ci{display:flex;gap:.65rem;padding:.7rem .1rem;align-items:flex-start;border-bottom:1px dashed var(--border-soft);animation:popIn .2s ease}
.ci:last-child{border-bottom:none}
.ci-img{width:46px;height:46px;border-radius:10px;background:#fff;border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;padding:3px;cursor:pointer}
.ci-img img{max-width:100%;max-height:100%;object-fit:contain}
.ci-body{flex:1;min-width:0}
.ci-name{font-size:.78rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.15rem;cursor:pointer}
.ci-price{font-size:.68rem;color:var(--text-muted);margin-bottom:.35rem}
.ci-qty{display:flex;align-items:center;gap:.35rem}
.ci-qty button{width:26px;height:26px;border-radius:8px;background:#fff;border:1.5px solid var(--border-soft);color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .15s}
.ci-qty button:hover{background:var(--gold-soft);color:var(--gold-dark);border-color:var(--gold)}
.ci-qty .n{font-weight:800;font-size:.82rem;color:var(--text);min-width:24px;text-align:center}
.ci-total{font-weight:800;font-size:.9rem;color:var(--gold-dark);white-space:nowrap;text-align:right}
.ci-remove{background:transparent;border:none;color:var(--text-light);cursor:pointer;padding:.2rem;font-size:.72rem;transition:color .15s;flex-shrink:0;align-self:flex-start}
.ci-remove:hover{color:var(--danger)}
.cart-foot{padding:1rem 1.1rem 1.1rem;border-top:1px solid var(--border-soft);flex-shrink:0;background:linear-gradient(180deg,#fff,var(--surface-alt))}
.totals .row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--text-muted);padding:.25rem 0;font-weight:600}
.totals .row.ship{color:var(--gold-dark)}
.totals .row.grand{border-top:1px solid var(--border-soft);margin-top:.4rem;padding-top:.7rem;font-size:1.3rem;font-weight:800;color:var(--text);letter-spacing:-.03em}
.totals .row.grand .k{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);align-self:center}
.btn-checkout{width:100%;padding:.95rem;background:var(--text);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-weight:800;font-size:.88rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.5rem;letter-spacing:.2px;margin-top:.85rem}

/* MODAL */

.modal{background:#fff;border-radius:24px 24px 0 0;padding:1.5rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 -8px 40px -8px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.modal-overlay.active .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.2rem}

/* FORMS */
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:700;font-size:.75rem;color:var(--text-soft);margin-bottom:.4rem;letter-spacing:.2px}
.form-group label .req{color:var(--danger);margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.75rem 1rem;border:1.5px solid var(--border-soft);border-radius:var(--radius);font-family:var(--font);font-size:.88rem;background:var(--surface-alt);outline:none;transition:all .2s;color:var(--text)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px var(--gold-tint)}

.btn{padding:.55rem 1rem;border-radius:var(--radius-full);font-weight:700;font-size:.78rem;cursor:pointer;border:1.5px solid transparent;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-family:var(--font);text-decoration:none}

/* TOAST */
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;width:90%;max-width:380px}

.toast.success{background:var(--success)}

@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ACCESS DENIED */
.access-denied{max-width:480px;margin:3rem auto;text-align:center;padding:3rem 2rem;background:#fff;border-radius:var(--radius-xl);border:1.5px solid #fecaca;box-shadow:var(--shadow-md)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:2.5rem 1.5rem}
.empty-state-icon{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--gold-soft),#fff);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.8rem;color:var(--gold-dark);box-shadow:var(--shadow-sm)}

  .modal,.prod-card,.ci,.pcard-add{transition:none;animation:none}
}

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC7kppUyHUaPzeLBV62NEZWuHiuz1Kz0mA",
  authDomain: "mugera-e51cc.firebaseapp.com",
  databaseURL: "https://mugera-e51cc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mugera-e51cc"
});
const auth = firebase.auth();
const db = firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.warn('Persistence:', e));

/* CONFIG */
const DELIVERY_FEE = 100;
const WORKSPACE_KEY = 'fusion-foods';   // the permission key this page gates on
const FIELD_ORDER_SOURCE = 'field_order'; // how the source is tagged on orders

/* STATE */
let currentUser = null;
let currentBusiness = null;
let currentSlug = null;
let currentRole = 'operator';
let businesses = [];
let currentTab = 'new';
let allProducts = {};
let allOrders = {};
let cart = [];
let productSearch = '';
let categoryFilter = '';
let orderType = 'delivery';
let paymentMethod = 'cash';
let isReady = false;
let ordersRef = null, ordersListener = null;
let productsRef = null, productsListener = null;
let pdCurrentId = null;
let pdQty = 1;

/* UTILS */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(n){const v=Number(n)||0;return 'KES '+v.toLocaleString('en-KE')}
function initials(n){if(!n)return'?';return String(n).trim().split(/\s+/).map(x=>x[0]).join('').toUpperCase().slice(0,2)}
function timeAgo(ts){if(!ts)return'';const d=Date.now()-Number(ts);const s=Math.floor(d/1000);if(s<60)return'Just now';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const dd=Math.floor(h/24);if(dd<7)return dd+'d ago';return new Date(Number(ts)).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
function toast(msg,type=''){const c=document.getElementById('toastContainer');const el=document.createElement('div');el.className='toast'+(type?' '+type:'');const ic={success:'check-circle',error:'exclamation-circle',info:'info-circle'};el.innerHTML=`<i class="fas fa-${ic[type]||'bell'}"></i><span>${esc(msg)}</span>`;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(20px)';setTimeout(()=>el.remove(),300)},3200)}
function openModal(html){document.getElementById('modalContent').innerHTML='<div class="modal-handle"></div>'+html;document.getElementById('modalOverlay').classList.add('active');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active');document.body.style.overflow='';pdCurrentId=null;pdQty=1}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('userDropdown')?.classList.remove('open');document.getElementById('bizMenu')?.classList.remove('on')}});
window.toggleUserMenu=()=>{document.getElementById('userDropdown').classList.toggle('open');document.getElementById('bizMenu')?.classList.remove('on')};
window.toggleBizMenu=e=>{e.stopPropagation();const m=document.getElementById('bizMenu');if(!m)return;m.classList.toggle('on');document.getElementById('userDropdown')?.classList.remove('open')};
document.addEventListener('click',e=>{
  if(!document.getElementById('userMenu')?.contains(e.target))document.getElementById('userDropdown')?.classList.remove('open');
  const chip=document.getElementById('bizChip');
  const menu=document.getElementById('bizMenu');
  if(chip && menu && !chip.contains(e.target) && !menu.contains(e.target))menu.classList.remove('on');
});

/* Minimal markdown-ish renderer */
function renderDescription(text){
  if(!text)return '';
  let t=String(text);
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
  const lines=t.split(/\r?\n/);
  let html='';
  let buffer=[];
  const flush=()=>{if(buffer.length){html+='<p>'+buffer.join('<br>')+'</p>';buffer=[]}};
  lines.forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed){flush();return;}
    buffer.push(trimmed);
  });
  flush();
  return html;
}

/* TABS */
window.switchTab=function(tab){
  currentTab=tab;
  document.getElementById('userDropdown')?.classList.remove('open');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const map={new:'tabNew',orders:'tabOrders'};
  document.getElementById(map[tab])?.classList.add('active');
  renderTab();
};

/* DATA LOADING */
function attachProducts(){
  detachProducts();
  if(!currentBusiness?.uid){allProducts={};return}
  productsRef=db.ref('brandinn_users/'+currentBusiness.uid+'/pageData/products');
  productsListener=snap=>{
    const raw=snap.val();
    if(!raw)allProducts={};
    else if(Array.isArray(raw))allProducts=Object.fromEntries(raw.filter(Boolean).map(p=>[p.id,p]));
    else allProducts=raw;
    Object.keys(allProducts).forEach(k=>{
      if(allProducts[k].active===false)delete allProducts[k];
    });
    if(isReady && currentTab==='new')renderTab();
  };
  productsRef.on('value',productsListener,err=>console.error('[Field] products error:',err));
}
function detachProducts(){
  if(productsRef&&productsListener){try{productsRef.off('value',productsListener)}catch(e){}}
  productsRef=null;productsListener=null;
}

function attachOrders(){
  detachOrders();
  if(!currentSlug){allOrders={};return}
  ordersRef=db.ref('brandinn_orders/'+currentSlug);
  ordersListener=snap=>{
    const raw=snap.val()||{};
    const mine={};
    Object.entries(raw).forEach(([id,o])=>{
      if(!o)return;
      // Only field orders created by this assistant
      if(o.createdBy===currentUser.uid && o.source===FIELD_ORDER_SOURCE)mine[id]=o;
    });
    allOrders=mine;
    document.getElementById('ordersCount').textContent=Object.keys(allOrders).length;
    if(isReady && currentTab==='orders')renderTab();
  };
  ordersRef.on('value',ordersListener,err=>console.error('[Field] orders error:',err));
}
function detachOrders(){
  if(ordersRef&&ordersListener){try{ordersRef.off('value',ordersListener)}catch(e){}}
  ordersRef=null;ordersListener=null;
}

/* ACCESS GATE + BUSINESS RESOLUTION */
auth.onAuthStateChanged(async user=>{
  if(!user){
    await new Promise(r=>setTimeout(r,800));
    if(!firebase.auth().currentUser){window.location.replace('/');return}
    user=firebase.auth().currentUser;
  }
  currentUser=user;

  const name=user.displayName||user.email?.split('@')[0]||'Field Assistant';
  document.getElementById('dropdownName').textContent=name;
  document.getElementById('dropdownEmail').textContent=user.email||'';
  document.getElementById('dropdownAvatar').textContent=initials(name);
  document.getElementById('userAvatarText').textContent=initials(name);
  if(user.photoURL){
    document.getElementById('userAvatarText').style.display='none';
    const img=document.getElementById('userAvatarImg');
    img.style.display='block';
    img.src=user.photoURL;
    document.getElementById('dropdownAvatar').innerHTML=`<img src="${esc(user.photoURL)}" alt="">`;
  }

  try{
    // Check workspace permission using the workspace key
    const permSnap=await db.ref('workspacePermissions/'+user.uid).once('value');
    const perms=permSnap.val()||{};
    const hasAccess=perms[WORKSPACE_KEY]===true;
    const isAdmin=(await db.ref('admins/'+user.uid).once('value')).val()===true;

    if(!hasAccess && !isAdmin){
      renderAccessDenied("You don't have permission to access the Field Ops workspace.");
      return;
    }

    const assignSnap=await db.ref('user_assignments/'+user.uid).once('value');
    const assignments=assignSnap.val()||{};
    const slugs=Object.keys(assignments).filter(s=>assignments[s]&&assignments[s].active!==false);

    if(!slugs.length){
      if(isAdmin){
        const subsSnap=await db.ref('brandinn_subdomains').once('value');
        const subs=subsSnap.val()||{};
        // Prefer slugs the admin is assigned to the workspace for; otherwise pick first
        const allSlugs=Object.keys(subs);
        if(allSlugs.length){
          businesses=allSlugs.slice(0,3).map(slug=>({
            slug,
            uid:subs[slug]?.uid||'',
            name:subs[slug]?.businessName||subs[slug]?.name||slug,
            logo:subs[slug]?.logo||'',
            role:'owner'
          }));
        } else {
          renderAccessDenied("No businesses found in the system.");
          return;
        }
      } else {
        renderAccessDenied("You haven't been assigned to any business. Contact your supervisor.");
        return;
      }
    } else {
      const bizSnaps=await Promise.all(slugs.map(s=>db.ref('brandinn_subdomains/'+s).once('value')));
      businesses=slugs.map((slug,i)=>{
        const b=bizSnaps[i].val()||{};
        const a=assignments[slug];
        return {
          slug,
          uid:b.uid||'',
          name:b.businessName||b.name||slug,
          logo:b.logo||'',
          role:a.role||'operator'
        };
      }).filter(b=>b.uid);
    }

    if(!businesses.length){
      renderAccessDenied("No business is set up for you yet.");
      return;
    }

    const urlSlug=new URLSearchParams(location.search).get('slug');
    const savedSlug=localStorage.getItem('brandinn_current_slug');
    const pick=businesses.find(b=>b.slug===urlSlug)
             ||businesses.find(b=>b.slug===savedSlug)
             ||businesses[0];

    currentBusiness=pick;
    currentSlug=pick.slug;
    currentRole=pick.role;
    localStorage.setItem('brandinn_current_slug',currentSlug);

    renderBizSwitcher();
    isReady=true;
    attachProducts();
    attachOrders();
    renderTab();
  }catch(e){
    console.error('[Field] auth error:',e);
    renderAccessDenied('Something went wrong. Please try again.');
  }
});

function renderBizSwitcher(){
  const chip=document.getElementById('bizChip');
  const av=document.getElementById('bizAv');
  const nm=document.getElementById('bizNm');
  const chev=document.getElementById('bizChev');
  if(!chip||!currentBusiness)return;

  chip.style.display='flex';
  if(currentBusiness.logo){
    av.innerHTML=`<img src="${esc(currentBusiness.logo)}" onerror="this.parentNode.textContent='${esc(initials(currentBusiness.name))}'">`;
  } else {
    av.textContent=initials(currentBusiness.name);
  }
  nm.textContent=currentBusiness.name;

  const canSwitch=businesses.length>1;
  chev.style.display=canSwitch?'inline-block':'none';
  chip.style.cursor=canSwitch?'pointer':'default';
  chip.onclick=canSwitch?toggleBizMenu:null;

  const menu=document.getElementById('bizMenu');
  if(!canSwitch){menu.classList.remove('on');return}
  menu.innerHTML=`
    <div class="sh">Your businesses</div>
    ${businesses.map(b=>`
      <a class="it ${b.slug===currentSlug?'current':''}" href="?slug=${encodeURIComponent(b.slug)}">
        <div class="av">${b.logo?`<img src="${esc(b.logo)}" onerror="this.parentNode.textContent='${esc(initials(b.name))}'">`:esc(initials(b.name))}</div>
        <div class="inf">
          <div class="nm">${esc(b.name)}</div>
          <div class="rl">${esc(b.role)}</div>
        </div>
        ${b.slug===currentSlug?'<i class="fas fa-check ck"></i>':''}
      </a>
    `).join('')}
  `;
}

function filteredProducts(){
  let list=Object.entries(allProducts).map(([id,p])=>({id,...p}));
  if(categoryFilter)list=list.filter(p=>(p.category||'')===categoryFilter);
  if(productSearch){
    const f=productSearch.toLowerCase();
    list=list.filter(p=>((p.name||'')+' '+(p.category||'')+' '+(p.sku||'')).toLowerCase().includes(f));
  }
  return list;
}

      <div>
        <span class="pd-price">${money(price)}</span>

        <h4>Description</h4>

        <h4>Quantity</h4>
        <div class="pd-qty">
          <button onclick="pdDec()" ${pdQty<=1?'disabled':''}><i class="fas fa-minus"></i></button>
          <span class="n">${pdQty}</span>

        </div>

          <span>Subtotal</span>
          <span class="v">${money(subtotal)}</span>
        </div>
      </div>
      <div class="pd-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-gold" onclick="pdAddToCart()"><i class="fas fa-cart-plus"></i> Add ${pdQty} to order</button>

    `:`

window.pdInc=function(){
  const p=allProducts[pdCurrentId];
  if(!p)return;
  const stock=p.stock;
  if(stock!=null && pdQty>=Number(stock)){toast('Not enough stock','error');return}
  pdQty++;
  renderProductDetailSheet();
};
window.pdDec=function(){
  if(pdQty<=1)return;
  pdQty--;
  renderProductDetailSheet();
};
window.pdAddToCart=function(){
  const p=allProducts[pdCurrentId];
  if(!p)return;
  const stock=p.stock;
  const price=Number(p.price)||0;
  const existing=cart.find(c=>c.productId===pdCurrentId);
  if(existing){
    const newQty=existing.qty+pdQty;
    if(stock!=null && newQty>Number(stock)){toast('Not enough stock','error');return}
    existing.qty=newQty;
  } else {
    if(stock!=null && pdQty>Number(stock)){toast('Not enough stock','error');return}
    cart.push({productId:pdCurrentId,name:p.name||'Unnamed',price,qty:pdQty,img:p.img||p.image||''});
  }
  if(navigator.vibrate)navigator.vibrate(20);
  toast(`${p.name||'Item'} × ${pdQty} added`,'success');
  closeModal();
  renderTab();
};

/* QUICK-ADD */
window.addToCart=function(id){
  const p=allProducts[id];
  if(!p)return;
  const stock=p.stock;
  if(stock!=null && Number(stock)<=0){toast('Out of stock','error');return}
  const price=Number(p.price)||0;
  const existing=cart.find(c=>c.productId===id);
  if(existing){
    if(stock!=null && existing.qty>=Number(stock)){toast('Not enough stock','error');return}
    existing.qty++;
  } else {
    cart.push({productId:id,name:p.name||'Unnamed',price,qty:1,img:p.img||p.image||''});
  }
  if(navigator.vibrate)navigator.vibrate(15);
  toast(`${p.name||'Item'} added`,'success');
  renderTab();
};

window.updateQty=function(id,delta){
  const item=cart.find(c=>c.productId===id);
  if(!item)return;
  const nq=item.qty+delta;
  if(nq<=0)cart=cart.filter(c=>c.productId!==id);
  else item.qty=nq;
  renderTab();
};
window.removeItem=function(id){cart=cart.filter(c=>c.productId!==id);renderTab()};
window.clearCart=function(){
  if(!cart.length)return;
  if(!confirm('Clear all items from cart?'))return;
  cart=[];
  renderTab();
};

/* TOTALS — includes fixed delivery fee */
function cartTotals(){
  const items=cart.reduce((s,c)=>s+c.qty,0);
  const subtotal=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const shipping=cart.length?DELIVERY_FEE:0;
  return {items,subtotal,shipping,total:subtotal+shipping};
}

window.placeOrder=async function(){
  if(!cart.length)return toast('Cart is empty','error');
  if(!currentSlug)return toast('No business selected','error');

  const btn=document.getElementById('placeOrderBtn');
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Placing...';

  const t=cartTotals();
  const name=(document.getElementById('coName')?.value||'').trim();
  const phone=(document.getElementById('coPhone')?.value||'').trim();
  const address=(document.getElementById('coAddress')?.value||'').trim();
  const notes=(document.getElementById('coNotes')?.value||'').trim();

  const orderId='ord_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const now=Date.now();

  const order={
    orderId,
    createdAt: now,
    updatedAt: now,
    currency: 'KSh',
    customerName: name || 'Walk-in',
    customerPhone: phone || '',
    customerEmail: '',
    customerAddress: address || '',
    items: cart.map(c=>({productId:c.productId,name:c.name,price:c.price,qty:c.qty,img:c.img||''})),
    subtotal: t.subtotal,
    shipping: t.shipping,
    total: t.total,
    paymentMethod: paymentMethod,
    paymentStatus: paymentMethod==='cash' ? 'paid' : 'unpaid',
    orderType: orderType,
    notes: notes,
    status: 'confirmed',
    source: FIELD_ORDER_SOURCE,   // ← tagged as a field order, NOT a POS order
    createdBy: currentUser.uid,
    createdByName: currentUser.displayName || currentUser.email || 'Field Assistant'
  };

  try {
    await db.ref('brandinn_orders/'+currentSlug+'/'+orderId).set(order);
    cart=[];
    updateMobileCartBar();
    showConfirmation(order);
  } catch(e) {
    console.error('[Field] place order error:',e);
    toast('Failed to place order: '+e.message,'error');
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-paper-plane"></i> Place order';
  }
};

function showConfirmation(order){
  const waText = encodeURIComponent(
    `*Order ${order.orderId.slice(-6).toUpperCase()}*\n\n` +
    `Customer: ${order.customerName}\n` +
    `Items:\n` +
    order.items.map(i=>`• ${i.qty}× ${i.name} — ${money(i.price*i.qty)}`).join('\n') +
    `\n\nSubtotal: ${money(order.subtotal)}` +
    `\nDelivery: ${money(order.shipping)}` +
    `\n*Total: ${money(order.total)}*\n` +
    `Payment: ${order.paymentMethod.toUpperCase()}\n` +
    `Placed by: ${order.createdByName}`
  );
  const waLink = `https://wa.me/?text=${waText}`;

  openModal(`
    <div class="confirm-hero">
      <div class="check"><i class="fas fa-check"></i></div>
      <h2>Order placed</h2>
      <p>The team has been notified.</p>
      <div class="order-ref">${esc(order.orderId.slice(-6).toUpperCase())}</div>
    </div>

    <div class="summary-box">
      <div class="row"><span class="k">Customer</span><span>${esc(order.customerName)}</span></div>
      <div class="row"><span class="k">Items</span><span>${order.items.reduce((s,i)=>s+i.qty,0)}</span></div>
      <div class="row"><span class="k">Payment</span><span>${esc(order.paymentMethod.toUpperCase())}</span></div>
      <div class="row"><span class="k">Subtotal</span><span>${money(order.subtotal)}</span></div>
      <div class="row ship"><span class="k">Delivery</span><span>${money(order.shipping)}</span></div>
      <div class="row grand"><span class="k">Total</span><span>${money(order.total)}</span></div>
    </div>

    <div class="form-actions" style="flex-direction:column;gap:.5rem;">
      <a class="btn btn-gold" href="${waLink}" target="_blank" style="width:100%;"><i class="fab fa-whatsapp"></i> Share on WhatsApp</a>
      <button class="btn btn-outline" onclick="copyOrderSummary('${esc(order.orderId)}')" style="width:100%;"><i class="fas fa-copy"></i> Copy summary</button>
      <button class="btn btn-primary" onclick="closeModal();switchTab('orders');" style="width:100%;"><i class="fas fa-receipt"></i> View my orders</button>
      <button class="btn btn-outline" onclick="closeModal();switchTab('new');" style="width:100%;">Start another order</button>
    </div>
  `);
}

window.copyOrderSummary=async function(orderId){
  const o=allOrders[orderId];
  const text=o?`Order ${o.orderId.slice(-6).toUpperCase()}\nCustomer: ${o.customerName}\nSubtotal: ${money(o.subtotal)}\nDelivery: ${money(o.shipping||0)}\nTotal: ${money(o.total)}`:`Order ${orderId}`;
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard','success')}
  catch(e){toast('Copy failed','error')}
};

/* TAB 2: MY ORDERS */
function renderMyOrders(){
  const orders=Object.entries(allOrders).map(([id,o])=>({id,...o})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!orders.length){
    return `<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-receipt"></i></div><h4>No orders yet</h4><p>Place your first order from the New Order tab.</p></div>`;
  }
  return orders.map(o=>{
    const itemCount=(o.items||[]).reduce((s,i)=>s+(Number(i.qty)||1),0);
    const status=(o.status||'pending').toLowerCase();
    return `
      <div class="order-card" onclick="showOrderDetail('${esc(o.id)}')">
        <div class="oc-icon"><i class="fas fa-receipt"></i></div>
        <div class="oc-body">
          <div class="oc-title">${esc(o.customerName||'Customer')} <span style="color:var(--text-muted);font-weight:600;font-size:.78rem;">· #${esc((o.orderId||'').slice(-6).toUpperCase())}</span></div>
          <div class="oc-meta">
            <span><i class="fas fa-box"></i> ${itemCount} item${itemCount!==1?'s':''}</span>
            <span><i class="fas fa-credit-card"></i> ${esc((o.paymentMethod||'cash').toUpperCase())}</span>
            ${o.createdAt?`<span><i class="fas fa-clock"></i> ${timeAgo(o.createdAt)}</span>`:''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;">
          <span class="pill ${status}">${esc(status)}</span>
          <div class="oc-total">${money(o.total)}</div>
        </div>
      </div>
    `;
  }).join('');
}

window.showOrderDetail=function(id){
  const o=allOrders[id];
  if(!o)return;
  const subtotal=Number(o.subtotal)||0;
  const shipping=Number(o.shipping)||0;
  openModal(`
    <div class="modal-header">
      <h3><i class="fas fa-receipt"></i> #${esc((o.orderId||'').slice(-6).toUpperCase())}</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="summary-box" style="margin-bottom:1rem;">
      <div class="row"><span class="k">Customer</span><span>${esc(o.customerName||'—')}</span></div>
      <div class="row"><span class="k">Status</span><span class="pill ${(o.status||'pending').toLowerCase()}">${esc((o.status||'pending').toLowerCase())}</span></div>
      <div class="row"><span class="k">Order type</span><span>${esc((o.orderType||'—').replace(/_/g,' '))}</span></div>
      <div class="row"><span class="k">Payment</span><span>${esc((o.paymentMethod||'—').toUpperCase())}</span></div>
      <div class="row"><span class="k">Placed</span><span>${o.createdAt?timeAgo(o.createdAt):'—'}</span></div>
    </div>
    <div style="border:1px solid var(--border-soft);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1rem;">
      ${(o.items||[]).map(i=>`
        <div style="display:flex;justify-content:space-between;padding:.35rem 0;font-size:.85rem;">
          <span>${esc(i.name)} × ${i.qty}</span>
          <span style="font-weight:700;">${money(i.price*i.qty)}</span>
        </div>
      `).join('')}
      <div style="display:flex;justify-content:space-between;padding:.35rem 0;font-size:.85rem;color:var(--text-muted);">
        <span>Subtotal</span><span>${money(subtotal)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:.35rem 0;font-size:.85rem;color:var(--gold-dark);font-weight:700;">
        <span>Delivery</span><span>${money(shipping)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding-top:.6rem;margin-top:.4rem;border-top:1px solid var(--border-soft);font-weight:800;font-size:1rem;">
        <span>Total</span><span style="color:var(--gold-dark);">${money(o.total)}</span>
      </div>
    </div>
    ${o.notes?`<div class="form-group"><label>Notes</label><div style="background:var(--surface-alt);padding:.75rem 1rem;border-radius:var(--radius);font-size:.85rem;">${esc(o.notes)}</div></div>`:''}
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="reorder('${esc(id)}')"><i class="fas fa-redo"></i> Reorder</button>
    </div>
  `);
};

window.reorder=function(id){
  const o=allOrders[id];
  if(!o)return;
  cart=(o.items||[]).map(i=>({productId:i.productId,name:i.name,price:i.price,qty:i.qty,img:i.img||''}));
  closeModal();
  switchTab('new');
  toast('Items added to cart','success');
};

/* LOGOUT */
window.handleLogout=async function(){
  try{detachProducts();detachOrders();await auth.signOut();window.location.href='/'}
  catch(e){toast('Error signing out','error')}
}
</script>
</body>
</html>
